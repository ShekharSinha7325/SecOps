name: step-2 - Recieve Application Trigger
on:
  repository_dispatch:
    types:
      - appliaction_push

jobs:
  recieve-trigger:
    name: Verify Cross-Repo Communication
    runs-on: ubuntu-latest

    steps:
      - name: Display Recieved application Information
        run: |
          echo "SecOps Repo recieved Application trigger"
          echo "Application Repository: ${{github.event.client_payload.repository}}"
          echo "Application Branch: ${{ github.event.client_payload.repository}}"
          echo "Application Commit SHA: ${{ github.event.client_payload.commit_sha}}"